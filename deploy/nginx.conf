# Reference nginx site config for biznetconsulting.ae.
# Merge the marked parts into /etc/nginx/sites-available/biznetconsulting —
# keep the existing ssl_certificate lines and the /api/cms + /uploads blocks
# that point at the CMS API.

# http:// and www. → canonical https://biznetconsulting.ae (single 301 hop)
server {
    listen 80;
    listen [::]:80;
    server_name biznetconsulting.ae www.biznetconsulting.ae;
    return 301 https://biznetconsulting.ae$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.biznetconsulting.ae;
    # ssl_certificate ...; ssl_certificate_key ...;
    return 301 https://biznetconsulting.ae$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name biznetconsulting.ae;
    # ssl_certificate ...; ssl_certificate_key ...;

    root /var/www/biznet-website/dist;
    index index.html;

    # Retired URLs → their replacements (generated: npm run generate:redirects)
    include /var/www/biznet-website/deploy/nginx-redirects.conf;

    # Canonical URLs have no trailing slash: /about/ → /about
    rewrite ^/(.+)/$ /$1 permanent;

    # Site API (contact, newsletter, SEO refresh) — server.js under PM2
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # (keep the existing /api/cms/ and /uploads/ blocks above this one)

    # Hashed build assets and share images: cache hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /og/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Prerendered pages: /about → dist/about/index.html (200, no redirect).
    # Unknown paths get the prerendered 404 page with a real 404 status.
    # HTML revalidates so a rebuild / SEO refresh is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
